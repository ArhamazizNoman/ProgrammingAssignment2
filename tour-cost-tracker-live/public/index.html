<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tour Cost Tracker (Live)</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1c2434;
    --muted: #6b7688;
    --border: #e3e8f0;
    --accent: #3b82f6;
    --accent-soft: #eaf1ff;
    --green: #16a34a;
    --red: #dc2626;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #171e2c;
      --text: #e7ecf3;
      --muted: #97a1b3;
      --border: #26304180;
      --accent: #5b9bff;
      --accent-soft: #1b2740;
      --green: #34d399;
      --red: #f87171;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 64px; }
  header { text-align: center; margin: 8px 0 24px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -.02em; }
  header p { color: var(--muted); margin: 0; font-size: .92rem; }

  .status { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); margin-top: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent); }
  .dot.off { background: var(--red); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 1rem; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .emoji { font-size: 1.1rem; }

  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    color: var(--text);
    font-size: .95rem;
    font-family: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 120px; }

  button {
    font-family: inherit;
    font-size: .92rem;
    font-weight: 600;
    border: none;
    border-radius: 9px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter .12s ease, opacity .12s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { filter: brightness(.95); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--accent-soft); color: var(--accent); }
  .btn-icon {
    background: transparent; color: var(--muted); padding: 4px 8px; font-size: 1rem;
    border-radius: 6px;
  }
  .btn-icon:hover { color: var(--red); background: var(--bg); }

  .people-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--accent);
    padding: 5px 6px 5px 12px; border-radius: 999px; font-size: .88rem; font-weight: 600;
  }
  .chip.owner::before { content: "★"; }
  .chip .x { cursor: pointer; opacity: .6; padding: 0 4px; border-radius: 999px; }
  .chip .x:hover { opacity: 1; color: var(--red); }

  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; padding: 8px 8px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.amt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
  th.amt { text-align: right; }
  .payer-tag { display: inline-block; background: var(--accent-soft); color: var(--accent); padding: 2px 9px; border-radius: 999px; font-size: .8rem; font-weight: 600; }

  .empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: .9rem; }

  .total-hero { text-align: center; padding: 6px 0 4px; }
  .total-hero .n { font-size: 2.2rem; font-weight: 700; letter-spacing: -.02em; }
  .total-hero .l { color: var(--muted); font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; }

  .settle-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 4px; border-bottom: 1px solid var(--border); gap: 10px; }
  .settle-row:last-child { border-bottom: none; }
  .settle-name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .settle-name small { color: var(--muted); font-weight: 500; font-size: .78rem; }
  .settle-bal { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .zero { color: var(--muted); }

  .hint { font-size: .8rem; color: var(--muted); margin-top: 10px; }
  .settle-tips { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .settle-tips .t { font-size: .88rem; padding: 5px 0; display: flex; align-items: center; gap: 8px; }

  .toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .toolbar button { background: transparent; color: var(--muted); font-size: .82rem; padding: 6px 10px; }
  .toolbar button:hover { color: var(--red); }
  .curwrap { display: inline-flex; align-items: center; gap: 6px; }
  .curwrap select { width: auto; padding: 4px 8px; font-size: .82rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧳 Tour Cost Tracker</h1>
    <p>Everyone on the trip sees the same live totals.</p>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <section class="card">
    <h2><span class="emoji">👥</span> Who's on the trip</h2>
    <div class="people-list" id="peopleList"></div>
    <div class="row">
      <input id="personName" placeholder="Add a person…" maxlength="30" />
      <button class="btn-ghost" style="flex:0 0 auto" id="addPersonBtn">+ Add</button>
    </div>
    <p class="hint">The ★ person is the trip owner. Everyone shares the total equally.</p>
  </section>

  <section class="card">
    <h2><span class="emoji">➕</span> Add an expense</h2>
    <div class="row" style="margin-bottom:10px">
      <div style="flex:2">
        <label for="expDesc">What was it for?</label>
        <input id="expDesc" placeholder="e.g. Flight tickets, Bus, Hotel" maxlength="60" />
      </div>
      <div>
        <label for="expAmount">Amount</label>
        <input id="expAmount" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal" />
      </div>
    </div>
    <div class="row" style="margin-bottom:14px">
      <div>
        <label for="expPayer">Paid by</label>
        <select id="expPayer"></select>
      </div>
      <div>
        <label for="expDate">Date</label>
        <input id="expDate" type="date" />
      </div>
    </div>
    <button class="btn-primary" style="width:100%" id="addExpenseBtn">Add expense</button>
  </section>

  <section class="card">
    <div class="total-hero">
      <div class="n" id="grandTotal">0.00</div>
      <div class="l">Total tour cost &nbsp;·&nbsp; <span class="curwrap">Currency
        <select id="currencySel">
          <option value="$">$ USD</option>
          <option value="৳">৳ BDT</option>
          <option value="€">€ EUR</option>
          <option value="£">£ GBP</option>
          <option value="₹">₹ INR</option>
          <option value="¥">¥ JPY</option>
          <option value="">None</option>
        </select></span>
      </div>
    </div>
  </section>

  <section class="card">
    <h2><span class="emoji">🧾</span> Expenses</h2>
    <div id="expenseTableWrap"></div>
  </section>

  <section class="card">
    <h2><span class="emoji">⚖️</span> Who paid &amp; who owes</h2>
    <div id="settlement"></div>
  </section>

  <div class="toolbar">
    <button id="resetBtn">Reset all data</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var state = { people: [], expenses: [], currency: "$" };

  function $(id) { return document.getElementById(id); }

  function money(n) {
    var v = (Math.round(n * 100) / 100).toLocaleString(undefined, {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });
    return state.currency + v;
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---- API calls ----
  function api(method, url, body) {
    return fetch(url, {
      method: method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error(data && data.error ? data.error : ("HTTP " + r.status));
        return data;
      });
    });
  }

  function fail(e) { alert(e.message || "Something went wrong. Check your connection."); }

  // ---- Live updates via SSE ----
  var es = null;
  function connect() {
    es = new EventSource("/api/events");
    es.onopen = function () { setStatus(true); };
    es.onmessage = function (ev) {
      try { state = JSON.parse(ev.data); render(); } catch (e) {}
      setStatus(true);
    };
    es.onerror = function () {
      setStatus(false);
      // EventSource auto-reconnects; nothing else needed.
    };
  }

  function setStatus(on) {
    var dot = $("statusDot"), txt = $("statusText");
    dot.className = "dot " + (on ? "on" : "off");
    txt.textContent = on ? "Live · synced across devices" : "Reconnecting…";
  }

  // ---- Render ----
  function render() {
    renderPeople();
    renderPayerSelect();
    renderTotal();
    renderExpenses();
    renderSettlement();
    if ($("currencySel").value !== state.currency) $("currencySel").value = state.currency;
  }

  function renderPeople() {
    var list = $("peopleList");
    list.innerHTML = "";
    state.people.forEach(function (name, i) {
      var chip = document.createElement("span");
      chip.className = "chip" + (i === 0 ? " owner" : "");
      chip.appendChild(document.createTextNode(name));
      var x = document.createElement("span");
      x.className = "x"; x.textContent = "✕"; x.title = "Remove " + name;
      x.onclick = function () { removePerson(name); };
      chip.appendChild(x);
      list.appendChild(chip);
    });
  }

  function renderPayerSelect() {
    var sel = $("expPayer");
    var current = sel.value;
    sel.innerHTML = "";
    state.people.forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    if (state.people.indexOf(current) !== -1) sel.value = current;
  }

  function renderTotal() {
    var total = state.expenses.reduce(function (s, e) { return s + e.amount; }, 0);
    $("grandTotal").textContent = money(total);
  }

  function renderExpenses() {
    var wrap = $("expenseTableWrap");
    if (state.expenses.length === 0) {
      wrap.innerHTML = '<div class="empty">No expenses yet. Add flight, bus, hotel and other costs above.</div>';
      return;
    }
    var rows = state.expenses.slice().sort(function (a, b) {
      return (a.date || "").localeCompare(b.date || "");
    });
    var html = '<table><thead><tr>' +
      '<th>What</th><th>Paid by</th><th>Date</th><th class="amt">Amount</th><th></th>' +
      '</tr></thead><tbody>';
    rows.forEach(function (e) {
      html += '<tr>' +
        '<td>' + esc(e.desc) + '</td>' +
        '<td><span class="payer-tag">' + esc(e.payer) + '</span></td>' +
        '<td style="color:var(--muted);white-space:nowrap">' + (e.date || "—") + '</td>' +
        '<td class="amt">' + money(e.amount) + '</td>' +
        '<td><button class="btn-icon" data-del="' + e.id + '" title="Delete">🗑</button></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    wrap.innerHTML = html;
    wrap.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () { deleteExpense(b.getAttribute("data-del")); };
    });
  }

  function renderSettlement() {
    var box = $("settlement");
    var n = state.people.length;
    if (n === 0 || state.expenses.length === 0) {
      box.innerHTML = '<div class="empty">Add people and expenses to see the settlement.</div>';
      return;
    }
    var total = state.expenses.reduce(function (s, e) { return s + e.amount; }, 0);
    var share = total / n;

    var paid = {};
    state.people.forEach(function (p) { paid[p] = 0; });
    state.expenses.forEach(function (e) {
      if (paid.hasOwnProperty(e.payer)) paid[e.payer] += e.amount;
    });

    var html = '<div class="hint" style="margin-top:0;margin-bottom:10px">Total ' + money(total) +
      ' split ' + n + ' ways = <b>' + money(share) + '</b> each.</div>';

    var balances = state.people.map(function (p) {
      return { name: p, paid: paid[p], bal: paid[p] - share };
    });

    balances.forEach(function (b) {
      var cls = b.bal > 0.005 ? "pos" : (b.bal < -0.005 ? "neg" : "zero");
      var sign = b.bal > 0.005 ? "gets back " : (b.bal < -0.005 ? "owes " : "");
      var balText = Math.abs(b.bal) < 0.005 ? "settled" : (sign + money(Math.abs(b.bal)));
      html += '<div class="settle-row">' +
        '<div class="settle-name">' + esc(b.name) + '<small>paid ' + money(b.paid) + '</small></div>' +
        '<div class="settle-bal ' + cls + '">' + balText + '</div>' +
        '</div>';
    });

    var transfers = computeTransfers(balances);
    if (transfers.length) {
      html += '<div class="settle-tips"><div class="hint" style="margin-top:0;margin-bottom:6px"><b>Suggested payments to settle up:</b></div>';
      transfers.forEach(function (t) {
        html += '<div class="t">💸 <span><b>' + esc(t.from) + '</b> pays <b>' + esc(t.to) +
          '</b> ' + money(t.amount) + '</span></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="settle-tips"><div class="t">✅ Everyone is settled up.</div></div>';
    }

    box.innerHTML = html;
  }

  function computeTransfers(balances) {
    var debtors = [], creditors = [];
    balances.forEach(function (b) {
      if (b.bal < -0.005) debtors.push({ name: b.name, amt: -b.bal });
      else if (b.bal > 0.005) creditors.push({ name: b.name, amt: b.bal });
    });
    debtors.sort(function (a, b) { return b.amt - a.amt; });
    creditors.sort(function (a, b) { return b.amt - a.amt; });
    var transfers = [], i = 0, j = 0, guard = 0;
    while (i < debtors.length && j < creditors.length && guard < 1000) {
      guard++;
      var pay = Math.min(debtors[i].amt, creditors[j].amt);
      if (pay > 0.005) transfers.push({ from: debtors[i].name, to: creditors[j].name, amount: pay });
      debtors[i].amt -= pay; creditors[j].amt -= pay;
      if (debtors[i].amt < 0.005) i++;
      if (creditors[j].amt < 0.005) j++;
    }
    return transfers;
  }

  // ---- Actions (optimistic UI comes from the server broadcast) ----
  function addPerson() {
    var input = $("personName");
    var name = input.value.trim();
    if (!name) return;
    input.value = "";
    api("POST", "/api/people", { name: name }).catch(fail);
    input.focus();
  }

  function removePerson(name) {
    var used = state.expenses.some(function (e) { return e.payer === name; });
    var msg = used
      ? name + ' has expenses recorded. Remove them anyway? Those expenses keep their name but "' + name + '" won\'t count in the split.'
      : "Remove " + name + "?";
    if (!confirm(msg)) return;
    api("DELETE", "/api/people", { name: name }).catch(fail);
  }

  function addExpense() {
    var desc = $("expDesc").value.trim();
    var amount = parseFloat($("expAmount").value);
    var payer = $("expPayer").value;
    var date = $("expDate").value;
    if (!desc) { alert("Please add a description (what was the cost for?)."); return; }
    if (!(amount > 0)) { alert("Please enter an amount greater than 0."); return; }
    if (!payer) { alert("Please add at least one person, then pick who paid."); return; }
    api("POST", "/api/expenses", { desc: desc, amount: amount, payer: payer, date: date || "" })
      .then(function () { $("expDesc").value = ""; $("expAmount").value = ""; $("expDesc").focus(); })
      .catch(fail);
  }

  function deleteExpense(id) {
    api("DELETE", "/api/expenses/" + encodeURIComponent(id)).catch(fail);
  }

  function resetAll() {
    if (!confirm("This erases the shared trip for EVERYONE. Continue?")) return;
    api("POST", "/api/reset").catch(fail);
  }

  // ---- Wire up ----
  $("addPersonBtn").onclick = addPerson;
  $("personName").addEventListener("keydown", function (e) { if (e.key === "Enter") addPerson(); });
  $("addExpenseBtn").onclick = addExpense;
  $("expAmount").addEventListener("keydown", function (e) { if (e.key === "Enter") addExpense(); });
  $("resetBtn").onclick = resetAll;
  $("currencySel").addEventListener("change", function () {
    api("POST", "/api/currency", { currency: this.value }).catch(fail);
  });

  $("expDate").value = new Date().toISOString().slice(0, 10);

  connect();
})();
</script>
</body>
</html>
